[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventum-hq"
version = "0.0.1"
description = "Eventum HQ — Telegram bot for managing the Eventum Space team's work and outputs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp-socks>=0.9",
    "SQLAlchemy[asyncio]>=2.0.30,<3",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "jdatetime>=5.0",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
